<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .box{fill:#1f2630;stroke-width:1.6}
    .p{stroke:#f5b83d}.d{stroke:#38d0f0}
    .t{fill:#e6edf3;font-size:14px;font-weight:600;text-anchor:middle}
    .s{fill:#8b949e;font-size:11px;text-anchor:middle}
    .flowP{stroke:#f5b83d;stroke-width:3;fill:none;stroke-dasharray:8 10;animation:dash 1.2s linear infinite}
    .flowD{stroke:#38d0f0;stroke-width:3;fill:none;stroke-dasharray:8 10;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-36}}
    .pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .fill{animation:fill 6s ease-in-out infinite}
    @keyframes fill{0%{width:10px}70%{width:92px}100%{width:92px}}
    .wave{fill:none;stroke:#38d0f0;stroke-width:2.2;stroke-linecap:round;animation:wave 1.8s ease-out infinite;opacity:0}
    .w2{animation-delay:.3s}.w3{animation-delay:.6s}
    @keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
    .cursor{animation:cur 5s ease-in-out infinite}
    @keyframes cur{0%,100%{transform:translate(0,0)}25%{transform:translate(38px,-14px)}50%{transform:translate(70px,16px)}75%{transform:translate(20px,26px)}}
  </style>

  <rect width="960" height="520" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text x="480" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">How It Works</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Charge once over USB-C, then run wirelessly for days</text>

  <!-- LANE 1: POWER -->
  <text x="40" y="92" fill="#f5b83d" font-size="12" font-weight="700">&#9312; CHARGE &amp; POWER PATH</text>

  <rect class="box p" x="40" y="115" width="145" height="70" rx="10"/>
  <text class="t" x="112" y="145">USB-C 5 V</text><text class="s" x="112" y="165">phone charger / PC</text>

  <rect class="box p" x="335" y="115" width="150" height="70" rx="10"/>
  <text class="t" x="410" y="143">Charging Module</text><text class="s" x="410" y="162">regulates charge current</text>
  <circle class="pulse" cx="470" cy="127" r="4" fill="#3fb950"/>

  <!-- battery -->
    <g transform="translate(560,118)">
    <rect x="0" y="0" width="110" height="64" rx="10" class="box p"/>
    <rect x="110" y="20" width="7" height="24" rx="2" fill="#f5b83d"/>
    <rect x="8" y="30" height="26" rx="4" fill="#3fb950" class="fill"/>
    <text x="55" y="20" class="s" style="fill:#e6edf3;font-weight:600;font-size:13px">Li-Po 3.7 V</text>
  </g>

  <!-- flow lines power -->
  <path d="M185 150 H333" class="flowP"/>
  <path d="M490 150 H558" class="flowP"/>
  <path d="M677 150 H700 V215" class="flowP"/>
  <circle r="5" fill="#f5b83d" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M185 150 H335 M335 150 H558"/>
  </circle>
  <circle r="5" fill="#f5b83d" filter="url(#glow)">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M185 150 H558"/>
  </circle>
  <circle r="5" fill="#f5b83d" filter="url(#glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M677 150 H700 V232"/>
  </circle>
  <text x="700" y="205" fill="#f5b83d" font-size="11" text-anchor="start" dx="10">to BAT header</text>

  <!-- Divider -->
  <line x1="40" y1="245" x2="920" y2="245" stroke="#30363d" stroke-dasharray="3 6"/>

  <!-- LANE 2: SIGNAL -->
  <text x="40" y="275" fill="#38d0f0" font-size="12" font-weight="700">&#9313; MOUSE OPERATION</text>

  
  <rect class="box d" x="40" y="335" width="140" height="90" rx="10"/>
  <text class="t" x="110" y="365">Sensor + Clicks</text><text class="s" x="110" y="385">optical movement</text><text class="s" x="110" y="401">buttons &amp; wheel</text>
  <circle class="pulse" cx="165" cy="349" r="4" fill="#ff4d4d"/>

  <rect class="box d" x="300" y="335" width="150" height="90" rx="10"/>
  <text class="t" x="375" y="365">Controller + RF</text><text class="s" x="375" y="385">encodes HID packets</text><text class="s" x="375" y="401">16 MHz clock</text>

  <rect class="box d" x="470" y="335" width="70" height="90" rx="10"/>
  <text class="t" x="505" y="373">TX</text><text class="s" x="505" y="391">ant.</text>

  <!-- BAT feed into mouse pcb -->
    <rect x="610" y="232" width="180" height="30" rx="8" fill="#1f2630" stroke="#f5b83d" stroke-width="1.6"/>
  <text x="700" y="252" class="t" style="font-size:12px">BAT header &#8594; mouse PCB</text>
  <path d="M700 262 V300 H375 V333" class="flowP" style="stroke-width:2"/>
  <path d="M375 300 H110 V333" class="flowP" style="stroke-width:2"/>
  <circle r="4" fill="#f5b83d" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M700 262 V300 H375 V333"/>
  </circle>
  <circle r="4" fill="#f5b83d" filter="url(#glow)">
    <animateMotion dur="3.2s" begin="1.2s" repeatCount="indefinite" path="M375 300 H110 V333"/>
  </circle>

  <path d="M180 380 H298" class="flowD"/>
  <path d="M450 380 H468" class="flowD"/>
  <circle r="4.5" fill="#38d0f0" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M180 380 H298 M300 380 H468"/>
  </circle>

  <!-- RF waves -->
  <g transform="translate(540,380)">
    <path class="wave" d="M10 -10 q10 10 0 20"/>
    <path class="wave w2" d="M26 -20 q18 20 0 40"/>
    <path class="wave w3" d="M44 -30 q26 30 0 60"/>
  </g>
  <text x="600" y="440" class="s">2.4 GHz wireless</text>

  <!-- Dongle -->
  <rect class="box d" x="670" y="335" width="115" height="90" rx="10"/>
  <text class="t" x="727" y="373">USB Dongle</text><text class="s" x="727" y="391">receiver</text>
  <path d="M785 380 H825" class="flowD"/>

  <!-- PC / screen -->
  <rect x="825" y="340" width="95" height="62" rx="6" fill="#1f2630" stroke="#38d0f0" stroke-width="1.6"/>
  <rect x="822" y="406" width="101" height="8" rx="3" fill="#38d0f0" opacity=".5"/>
  <text x="872" y="428" class="s">PC cursor</text>
  <g class="cursor">
    <path d="M850 352 L850 378 L857 372 L862 384 L867 382 L862 370 L871 370 Z" fill="#e6edf3"/>
  </g>

  <!-- Status strip -->
  <rect x="40" y="470" width="880" height="34" rx="8" fill="#10151c" stroke="#30363d"/>
  <circle class="pulse" cx="62" cy="487" r="5" fill="#3fb950"/>
  <text x="76" y="491" fill="#c9d1d9" font-size="12">USB-C charges the Li-Po &#8594; cell feeds the BAT header &#8594; mouse sends movement &amp; clicks over 2.4 GHz.</text>
</svg>
