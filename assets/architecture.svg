<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5b83d"/></marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38d0f0"/></marker>
  </defs>
  <rect width="960" height="460" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text x="480" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">System Architecture</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Zero-cost rechargeable wireless mouse mod</text>

  <!-- Power domain -->
  <rect x="30" y="80" width="900" height="130" rx="12" fill="none" stroke="#f5b83d" stroke-opacity=".5" stroke-dasharray="6 5"/>
  <text x="46" y="100" fill="#f5b83d" font-size="12" font-weight="700">POWER DOMAIN</text>

  <g>
    <rect x="50" y="120" width="170" height="70" rx="10" fill="#1f2630" stroke="#f5b83d"/>
    <text x="135" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">USB-C Port</text>
    <text x="135" y="170" text-anchor="middle" fill="#8b949e" font-size="11">5 V input</text>
  </g>
  <g>
    <rect x="290" y="120" width="210" height="70" rx="10" fill="#1f2630" stroke="#f5b83d"/>
    <text x="395" y="146" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Charging Module</text>
    <text x="395" y="164" text-anchor="middle" fill="#8b949e" font-size="11">ROCK-CHG_MB_V4 (from earbuds case)</text>
    <text x="395" y="180" text-anchor="middle" fill="#8b949e" font-size="11">charge control + protection</text>
  </g>
  <g>
    <rect x="570" y="120" width="170" height="70" rx="10" fill="#1f2630" stroke="#f5b83d"/>
    <text x="655" y="146" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Li-Po Cell</text>
    <text x="655" y="164" text-anchor="middle" fill="#8b949e" font-size="11">3.7 V, salvaged</text>
    <text x="655" y="180" text-anchor="middle" fill="#8b949e" font-size="11">B+ / B-</text>
  </g>
  <g>
    <rect x="800" y="120" width="110" height="70" rx="10" fill="#1f2630" stroke="#f5b83d"/>
    <text x="855" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">BAT Header</text>
    <text x="855" y="170" text-anchor="middle" fill="#8b949e" font-size="11">replaces AA</text>
  </g>
  <line x1="220" y1="155" x2="288" y2="155" stroke="#f5b83d" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="500" y1="155" x2="568" y2="155" stroke="#f5b83d" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="740" y1="155" x2="798" y2="155" stroke="#f5b83d" stroke-width="2.5" marker-end="url(#arrP)"/>

  <!-- Mouse PCB -->
  <path d="M855 190 V235" stroke="#f5b83d" stroke-width="2.5" marker-end="url(#arrP)" fill="none"/>
  <rect x="30" y="235" width="900" height="130" rx="12" fill="none" stroke="#38d0f0" stroke-opacity=".5" stroke-dasharray="6 5"/>
  <text x="46" y="255" fill="#38d0f0" font-size="12" font-weight="700">MOUSE MAIN PCB (BENRAT 3205 / BYKC FR58X-VER1.2)</text>

  <g>
    <rect x="50" y="270" width="150" height="75" rx="10" fill="#1f2630" stroke="#38d0f0"/>
    <text x="125" y="298" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Optical Sensor</text>
    <text x="125" y="316" text-anchor="middle" fill="#8b949e" font-size="11">U3, 8-pin + LED</text>
    <text x="125" y="332" text-anchor="middle" fill="#8b949e" font-size="11">tracks movement</text>
  </g>
  <g>
    <rect x="230" y="270" width="150" height="75" rx="10" fill="#1f2630" stroke="#38d0f0"/>
    <text x="305" y="298" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Switches + Wheel</text>
    <text x="305" y="316" text-anchor="middle" fill="#8b949e" font-size="11">L / R / middle click</text>
    <text x="305" y="332" text-anchor="middle" fill="#8b949e" font-size="11">encoder + DPI button</text>
  </g>
  <g>
    <rect x="410" y="270" width="150" height="75" rx="10" fill="#1f2630" stroke="#38d0f0"/>
    <text x="485" y="298" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Controller / RF IC</text>
    <text x="485" y="316" text-anchor="middle" fill="#8b949e" font-size="11">SOP-16, 16 MHz crystal</text>
    <text x="485" y="332" text-anchor="middle" fill="#8b949e" font-size="11">packs HID reports</text>
  </g>
  <g>
    <rect x="590" y="270" width="140" height="75" rx="10" fill="#1f2630" stroke="#38d0f0"/>
    <text x="660" y="298" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">PCB Antenna</text>
    <text x="660" y="316" text-anchor="middle" fill="#8b949e" font-size="11">trace antenna (A1)</text>
    <text x="660" y="332" text-anchor="middle" fill="#8b949e" font-size="11">2.4 GHz</text>
  </g>
  <line x1="200" y1="307" x2="228" y2="307" stroke="#38d0f0" stroke-width="2.5"/>
  <line x1="380" y1="307" x2="408" y2="307" stroke="#38d0f0" stroke-width="2.5"/>
  <line x1="560" y1="307" x2="588" y2="307" stroke="#38d0f0" stroke-width="2.5" marker-end="url(#arrD)"/>

  <!-- Wireless link to dongle/PC -->
  <g>
    <path d="M745 300 q18 7 0 14 M758 292 q28 15 0 30 M771 284 q38 23 0 46" fill="none" stroke="#38d0f0" stroke-width="2" stroke-linecap="round"/>
    <rect x="820" y="270" width="90" height="75" rx="10" fill="#1f2630" stroke="#38d0f0"/>
    <text x="865" y="298" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">USB Dongle</text>
    <text x="865" y="316" text-anchor="middle" fill="#8b949e" font-size="11">receiver</text>
    <text x="865" y="332" text-anchor="middle" fill="#8b949e" font-size="11">&#8594; PC</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#c9d1d9">
    <line x1="300" y1="415" x2="340" y2="415" stroke="#f5b83d" stroke-width="3"/><text x="350" y="419">Power flow</text>
    <line x1="470" y1="415" x2="510" y2="415" stroke="#38d0f0" stroke-width="3"/><text x="520" y="419">Signal / data flow</text>
  </g>
</svg>
